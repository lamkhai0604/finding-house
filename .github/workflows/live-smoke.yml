name: live-smoke

# T-405: read-only checks against the deployed site (D-029). Run by hand from the Actions tab
# after a deploy: Actions -> live-smoke -> Run workflow, with the two public URLs.

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Frontend (Vercel) production URL, e.g. https://finding-house.vercel.app"
        required: true
      api_url:
        description: "Backend (Render) URL, e.g. https://finding-house-api.onrender.com"
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Inputs pass through environment variables, never into the script text.
      FRONTEND_URL: ${{ inputs.frontend_url }}
      API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check the URLs are https origins
        run: |
          for value in "$FRONTEND_URL" "$API_URL"; do
            [[ "$value" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "not an https origin: $value"; exit 1; }
          done

      - name: HTTP checks (health, public API, auth, CORS, host headers, SPA routing)
        run: bash scripts/smoke/live-checks.sh

      - name: Install Playwright library (uses the runner's Chrome)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p /tmp/live && cp scripts/smoke/live-browser.mjs /tmp/live/
          cd /tmp/live && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1

      - name: Browser checks (desktop and phone, read-only)
        working-directory: /tmp/live
        run: node live-browser.mjs /tmp/live/shots

      - name: Print screenshots (gzip + base64)
        if: always()
        run: |
          for f in /tmp/live/shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SCREENSHOT-BEGIN $(basename "$f")"
            gzip -9 -c "$f" | base64 -w 1000
            echo "SCREENSHOT-END"
          done
