name: wrapper-gen (temporary, T-007)
on:
  push:
    branches: [chore/T-007-maven-wrapper]
    paths: [".github/workflows/wrapper-gen.yml"]
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B -ntp -N org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper -Dtype=only-script -Dmaven=3.9.11
      - run: ls -la . .mvn/wrapper && cat .mvn/wrapper/maven-wrapper.properties
      - name: Print files
        run: |
          for f in mvnw mvnw.cmd .mvn/wrapper/maven-wrapper.properties; do
            echo "FILE-BEGIN $f"; gzip -c "$f" | base64 -w0; echo; echo "FILE-END $f"
          done
      - run: ./mvnw -v
