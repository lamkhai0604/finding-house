name: frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, dev]
  # Lets the full suite run on an exact commit, e.g. a dev -> main merge candidate (T-112).
  workflow_dispatch:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (informational)
        run: npm audit || true
      - name: Report newer versions (informational)
        run: npm outdated || true
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Show formatting diff
        if: failure()
        run: npx prettier --write . && git diff
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build
      # T-114b: the deployed build talks to the backend on its own origin (D-030).
      - name: Deployment build checks
        run: |
          VITE_API_BASE_URL=https://api.example.test npm run build
          grep -q "connect-src 'self' https://api.example.test;" dist/index.html
          if VITE_API_BASE_URL=https://api.example.test/api npm run build > /tmp/bad-url.log 2>&1; then
            echo "a URL with a path was accepted as VITE_API_BASE_URL"; exit 1
          fi
          grep -q "VITE_API_BASE_URL must be an origin" /tmp/bad-url.log
          node -e '
            const config = JSON.parse(require("fs").readFileSync("vercel.json", "utf8"));
            const headers = Object.fromEntries(config.headers[0].headers.map((h) => [h.key, h.value]));
            const need = { "Content-Security-Policy": "frame-ancestors '"'"'none'"'"'",
              "X-Frame-Options": "DENY", "X-Content-Type-Options": "nosniff" };
            for (const [key, value] of Object.entries(need)) {
              if (headers[key] !== value) throw new Error(`vercel.json: ${key} should be ${value}`);
            }
            if (config.rewrites[0].destination !== "/index.html") throw new Error("SPA rewrite missing");
            console.log("vercel.json ok");
          '
