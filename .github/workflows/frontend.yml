name: frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Bootstrap: no lockfile is committed yet (T-004), so install resolves
      # versions and the generated lockfile is uploaded to be committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json
      - name: Report newer versions (informational)
        run: npm outdated || true
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Show formatting diff
        if: failure()
        run: npx prettier --write . && git diff
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build
