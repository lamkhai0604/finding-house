name: frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Bootstrap (T-102): adding react-router (D-022) needs a new lockfile, which Claude's
      # workspace cannot generate. Reverted to `npm ci` once the lockfile is committed.
      - name: Install dependencies (bootstrap, resolves react-router@latest)
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund react-router@latest
      - name: Print package.json and lockfile (bootstrap, gzip + base64)
        run: |
          sha256sum package.json package-lock.json
          for f in package.json package-lock.json; do
            echo "FILE-BEGIN $f"
            gzip -9 -c "$f" | base64 -w 1000
            echo "FILE-END"
          done
      - name: Report newer versions (informational)
        run: npm outdated || true
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Show formatting diff
        if: failure()
        run: npx prettier --write . && git diff
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build
