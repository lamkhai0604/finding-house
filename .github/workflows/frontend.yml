name: frontend

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Report newer versions (informational)
        run: npm outdated || true
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Show formatting diff
        if: failure()
        run: npx prettier --write . && git diff
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build
