name: smoke

# T-008: runs the app the way a developer does (README) and checks it end to end:
# docker compose PostgreSQL -> backend Docker image (the one Render runs, T-114a) -> API calls ->
# Vite dev server -> headless browser.

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/smoke/**"
      - "scripts/sample-data/**"
      - "docker-compose.yml"
      - ".github/workflows/smoke.yml"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env as a developer would (random secrets)
        run: |
          {
            echo "DB_URL=jdbc:postgresql://localhost:5432/findinghouse"
            echo "DB_USERNAME=findinghouse"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            # T-114b / D-030: the production build below runs on its own origin, like Vercel.
            echo "CORS_ALLOWED_ORIGINS=http://localhost:4173"
            # T-113: every check here signs up from one address (localhost); the live default is 10/hour.
            echo "REGISTRATION_MAX_PER_ADDRESS=1000"
            # T-303 / T-304: AI search against the fake provider in scripts/smoke/fake-ai.mjs.
            echo "AI_BASE_URL=http://localhost:9099/v1"
            echo "AI_MODEL=fake-model"
            echo "AI_API_KEY=smoke-$(openssl rand -hex 8)"
            echo "AI_LIMIT_PER_MINUTE=100"
          } > .env

      - name: Start the fake AI provider
        run: |
          nohup node scripts/smoke/fake-ai.mjs 9099 > /tmp/fake-ai.log 2>&1 &
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null && echo "fake AI up" && exit 0
            sleep 0.5
          done
          cat /tmp/fake-ai.log; exit 1

      - name: Start PostgreSQL with docker compose
        run: docker compose up -d --wait postgres

      - name: Build backend image (backend/Dockerfile, as deployed)
        run: docker build -t finding-house-backend backend

      - name: Start backend container (settings from .env, like the hosting dashboard)
        run: |
          # Host network so the container reaches the Compose database on localhost:5432.
          # Memory capped like the free hosting instance (512 MB).
          # T-605: the smoke-only administrator (D-036); the account is created before a restart.
          docker run -d --name finding-house-backend --network host --memory 512m \
            --env-file .env -e ADMIN_EMAILS=moderator.smoke@example.com finding-house-backend
          for i in $(seq 1 90); do
            curl -sf localhost:8080/actuator/health > /dev/null && echo "backend up after ${i}s" && exit 0
            sleep 1
          done
          echo "backend did not become healthy"; exit 1

      - name: API smoke test
        run: bash scripts/smoke/api-smoke.sh

      - name: Load sample data and check invalid examples (T-009)
        run: python3 scripts/sample-data/load_sample_data.py --check-invalid

      - name: Load sample data again (must not create duplicates)
        run: |
          python3 scripts/sample-data/load_sample_data.py | tee /tmp/second-load.txt
          grep -q "listings: 0 created, 12 already present" /tmp/second-load.txt

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          nohup npm run dev -- --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:5173 > /dev/null && echo "frontend up after ${i}s" && exit 0
            sleep 1
          done
          echo "frontend did not start"; exit 1

      - name: Build and serve the production frontend (with CSP, calling the API cross-origin)
        working-directory: frontend
        run: |
          # Like the deployment (D-030): page on :4173, API on :8080, CORS allows only :4173.
          VITE_API_BASE_URL=http://localhost:8080 npm run build
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -qE "connect-src (&#39;|')self(&#39;|') http://localhost:8080;" dist/index.html
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:4173 > /dev/null && echo "preview up after ${i}s" && exit 0
            sleep 1
          done
          echo "preview did not start"; exit 1

      # Uses the Google Chrome already installed on GitHub's runner image instead of downloading
      # a browser and its system packages (that step took 13+ minutes and could time out).
      - name: Install Playwright library (outside the app's dependencies)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p /tmp/e2e && cp scripts/smoke/browser-smoke.mjs /tmp/e2e/
          cd /tmp/e2e && npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright --version
          google-chrome --version

      - name: Browser check with backend running
        working-directory: /tmp/e2e
        run: node browser-smoke.mjs "API is up" /tmp/e2e/up.png

      - name: Page checks and screenshots with sample data (T-102, T-105, T-106, T-110)
        working-directory: /tmp/e2e
        run: |
          cp "$GITHUB_WORKSPACE/scripts/smoke/page-screenshots.mjs" .
          # Production build with CSP; the script fails on any CSP violation.
          FRONTEND_URL=http://localhost:4173 node page-screenshots.mjs /tmp/e2e/pages

      # T-405: the live-check scripts run here against the local stack, so they are known to work
      # before they are pointed at the deployment.
      - name: Live-check scripts against the local stack
        run: |
          FRONTEND_URL=http://localhost:4173 API_URL=http://localhost:8080 SKIP_FRONTEND_HEADERS=1 \
            bash scripts/smoke/live-checks.sh
          cp scripts/smoke/live-browser.mjs /tmp/e2e/
          cd /tmp/e2e && FRONTEND_URL=http://localhost:4173 node live-browser.mjs /tmp/e2e/live

      # T-216: every page at 375 px, with a check that nothing scrolls sideways.
      - name: Phone pass (375 px)
        working-directory: /tmp/e2e
        run: |
          cp "$GITHUB_WORKSPACE/scripts/smoke/phone-shots.mjs" .
          FRONTEND_URL=http://localhost:4173 node phone-shots.mjs /tmp/e2e/phone

      # T-303 / T-304: AI search end to end with the fake provider, every failure message, and
      # manual search still working.
      - name: AI search in the browser
        working-directory: /tmp/e2e
        run: |
          cp "$GITHUB_WORKSPACE/scripts/smoke/ai-search.mjs" .
          FRONTEND_URL=http://localhost:4173 node ai-search.mjs /tmp/e2e/ai

      # T-215: the demo content loads (password from a throwaway variable, like the live secret),
      # loading it twice creates nothing new, and its photos show up in the app.
      - name: Load demo content and screenshot it
        run: |
          export DEMO_PASSWORD="$(openssl rand -hex 16)"
          python3 scripts/demo-data/load_demo_data.py --base-url http://localhost:8080 --check-images
          python3 scripts/demo-data/load_demo_data.py --base-url http://localhost:8080 | tee /tmp/demo-second.txt
          grep -q "listings: 0 created" /tmp/demo-second.txt
          cp scripts/smoke/demo-shots.mjs /tmp/e2e/
          cd /tmp/e2e && FRONTEND_URL=http://localhost:4173 node demo-shots.mjs /tmp/e2e/demo

      # T-605 (FR-08): report, remove, landlord view, restore; desktop and phone. The administrator
      # exists only on this throwaway stack: a tenant account promoted by ADMIN_EMAILS on restart.
      - name: Moderation end to end
        working-directory: /tmp/e2e
        env:
          MODERATOR_PASSWORD: smoke-moderator-password
        run: |
          curl -sf -X POST localhost:8080/api/v1/auth/register -H 'Content-Type: application/json' \
            -d "{\"email\":\"moderator.smoke@example.com\",\"password\":\"$MODERATOR_PASSWORD\",\"displayName\":\"Smoke Moderator\",\"role\":\"TENANT\"}" > /dev/null
          docker restart finding-house-backend > /dev/null
          for i in $(seq 1 90); do
            curl -sf localhost:8080/actuator/health > /dev/null && break
            sleep 1
          done
          docker logs finding-house-backend 2>&1 | grep "Administrators from ADMIN_EMAILS"
          cp "$GITHUB_WORKSPACE/scripts/smoke/moderation.mjs" .
          FRONTEND_URL=http://localhost:4173 API_URL=http://localhost:8080 node moderation.mjs /tmp/e2e/moderation

      - name: Browser check with backend stopped
        working-directory: /tmp/e2e
        run: |
          docker stop finding-house-backend
          sleep 3
          # The Vite proxy may answer 5xx ("down") or drop the connection ("unreachable").
          node browser-smoke.mjs "API is down|API is unreachable" /tmp/e2e/down.png

      - name: Print screenshots (gzip + base64)
        if: always()
        run: |
          for f in /tmp/e2e/up.png /tmp/e2e/down.png /tmp/e2e/pages/*.jpg /tmp/e2e/demo/*.jpg /tmp/e2e/phone/*.jpg /tmp/e2e/ai/*.jpg /tmp/e2e/moderation/*.jpg; do
            [ -f "$f" ] || continue
            echo "SCREENSHOT-BEGIN $(basename "$f")"
            gzip -9 -c "$f" | base64 -w 1000
            echo "SCREENSHOT-END"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots
          path: |
            /tmp/e2e/*.png
            /tmp/e2e/pages/*.jpg
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- backend container ---"; docker logs --tail 150 finding-house-backend || true
          echo "--- frontend.log ---"; tail -n 50 frontend.log || true
          docker compose logs postgres | tail -n 50 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
