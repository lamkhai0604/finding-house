# Local development database. Credentials are for local use only;
# override them with a .env file (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: findinghouse
      POSTGRES_USER: ${DB_USERNAME:-findinghouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-findinghouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-findinghouse} -d findinghouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
