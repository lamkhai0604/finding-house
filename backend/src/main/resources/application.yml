spring:
  application:
    name: finding-house
  config:
    # Local development: read ../.env (repository root) when it exists.
    import: optional:file:../.env[.properties]
  datasource:
    # Defaults match docker-compose.yml for local development only.
    # Real deployments must set DB_URL, DB_USERNAME and DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/findinghouse}
    username: ${DB_USERNAME:findinghouse}
    password: ${DB_PASSWORD:findinghouse}
  jpa:
    # Schema is owned by Flyway (D-005); Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Required, at least 32 bytes. No default on purpose (D-009, CODE-08).
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:24h}
    issuer: finding-house
  # D-024: failed logins allowed per window before that email or client address is blocked.
  login-throttle:
    max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
    max-failures-per-address: ${LOGIN_MAX_FAILURES_PER_ADDRESS:20}
    window: ${LOGIN_THROTTLE_WINDOW:15m}
